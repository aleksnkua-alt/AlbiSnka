<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Для Альбины 🎀</title>
    <!-- Шрифт в стиле Monster High (Creepster) и милый рукописный -->
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            /* Фон в стиле Монстр Хай: темно-серый с розовым оттенком */
            background: radial-gradient(circle at center, #2a2a2a 0%, #000000 100%);
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Узор "Аргайл" (ромбики) на фоне */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(45deg, rgba(255, 0, 153, 0.1) 25%, transparent 25%, transparent 75%, rgba(255, 0, 153, 0.1) 75%, rgba(255, 0, 153, 0.1)),
                linear-gradient(45deg, rgba(255, 0, 153, 0.1) 25%, transparent 25%, transparent 75%, rgba(255, 0, 153, 0.1) 75%, rgba(255, 0, 153, 0.1));
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            opacity: 0.3;
            z-index: 0;
            pointer-events: none;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .ui-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
            width: 90%;
            pointer-events: none;
        }

        h1 {
            font-family: 'Creepster', cursive; /* Шрифт в стиле ужастиков */
            color: #ff0099; /* Hot Pink */
            font-size: 3.5rem;
            line-height: 1.1;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 
                2px 2px 0px #000, 
                -1px -1px 0 #00b7ff; /* Голубая обводка */
            margin-bottom: 10px;
            transition: all 0.5s ease;
        }

        p.instruction {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            color: #00b7ff; /* Ярко-голубой */
            font-size: 1.2rem;
            text-transform: uppercase;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 20px;
            border: 2px solid #ff0099;
            border-radius: 0; /* Острые углы */
            display: inline-block;
            box-shadow: 4px 4px 0px #ff0099;
            transition: opacity 0.5s;
        }

        /* Контейнер для котика */
        .cat-container {
            font-size: 6rem;
            margin: 20px auto;
            height: 180px;
            width: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
            /* Рамка в стиле MH */
            border: 3px dashed #ff0099;
            border-radius: 50%;
            background: rgba(0,0,0,0.5);
        }

        .cat-emoji {
            font-size: 5rem;
        }

        .shake {
            animation: shake 0.5s;
            animation-iteration-count: infinite;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        /* Картинка котенка */
        .happy-cat-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            /* Белая пушистая рамка */
            box-shadow: 0 0 20px #fff, inset 0 0 20px #fff; 
            animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        /* Прогресс бар - в стиле молнии/шва */
        .progress-wrapper {
            width: 100%;
            max-width: 280px;
            height: 30px;
            background: #000;
            border: 2px solid #00b7ff;
            margin: 0 auto;
            position: relative;
            transform: skewX(-10deg); /* Наклон */
            box-shadow: 4px 4px 0px #00b7ff;
            transition: opacity 1s;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: repeating-linear-gradient(
                90deg,
                #ff0099,
                #ff0099 10px,
                #cc007a 10px,
                #cc007a 20px
            );
            transition: width 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .progress-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) skewX(10deg); /* Обратный наклон текста */
            color: #fff;
            font-weight: 900;
            font-size: 1rem;
            z-index: 2;
            text-shadow: 1px 1px 0 #000;
        }

        .signature {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: #ff0099;
            font-family: 'Creepster', cursive;
            font-size: 1.5rem;
            letter-spacing: 1px;
            text-shadow: 1px 1px 0 #00b7ff;
        }

        .winner-text {
            color: #fff !important;
            text-shadow: 0 0 10px #ff0099, 0 0 20px #ff0099 !important;
            transform: scale(1.1);
        }
        
        @media (max-width: 600px) {
            h1 { font-size: 2.5rem; }
            .cat-container { width: 150px; height: 150px; }
        }
    </style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="gameCanvas"></canvas>
    </div>

    <div class="ui-container">
        <h1 id="mainTitle">Альбина<br>Солнышко 🎀</h1>
        
        <div class="cat-container" id="cat">
            <span class="cat-emoji">😿</span>
        </div>
        
        <p class="instruction" id="subTitle">Тапай 12 раз, чтобы прогнать болезнь!</p>
        
        <div class="progress-wrapper" id="progressWrapper">
            <div class="progress-bar" id="progressBar"></div>
            <div class="progress-text" id="progressText">0%</div>
        </div>
    </div>

    <div class="signature">С любовью, Саша 🖤</div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const mainTitle = document.getElementById('mainTitle');
        const subTitle = document.getElementById('subTitle');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const progressWrapper = document.getElementById('progressWrapper');
        const catContainer = document.getElementById('cat');

        let width, height;
        let particles = [];
        let clicks = 0;
        const maxClicks = 12;
        let isWon = false;

        // Эмодзи: стиль Monster High (молнии, губы, черепки, сердечки) + лечилки
        const healEmojis = ['💊', '🩹', '⚡', '💉', '✨', '🎀'];
        const winEmojis = ['🤍', '🎀', '⚡', '💋', '🐾', '💖'];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class EmojiParticle {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type;
                
                if (type === 'heal') {
                    this.text = healEmojis[Math.floor(Math.random() * healEmojis.length)];
                    this.size = Math.random() * 20 + 15; // Чуть меньше размер
                } else {
                    this.text = winEmojis[Math.floor(Math.random() * winEmojis.length)];
                    this.size = Math.random() * 25 + 20;
                }

                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6 + 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.life = 100;
                this.gravity = 0.2;
                this.rotation = Math.random() * 360;
                this.rotationSpeed = (Math.random() - 0.5) * 8;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += this.gravity;
                this.life -= 2; // Исчезают чуть быстрее
                this.rotation += this.rotationSpeed;
            }

            draw() {
                if (this.life <= 0) return;
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation * Math.PI / 180);
                ctx.globalAlpha = this.life / 100;
                ctx.font = `${this.size}px serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.text, 0, 0);
                ctx.restore();
            }
        }

        // Клик
        document.addEventListener('click', (e) => {
            if (isWon) {
                // Меньше частиц при клике после победы
                createExplosion(e.clientX, e.clientY, 'win', 3);
                return;
            }

            clicks++;
            
            // Анимация контейнера
            catContainer.style.transform = 'scale(0.9) rotate(-5deg)';
            setTimeout(() => {
                catContainer.style.transform = 'scale(1) rotate(0deg)';
            }, 100);

            // Прогресс
            const percentage = Math.min(Math.floor((clicks / maxClicks) * 100), 100);
            progressBar.style.width = percentage + '%';
            progressText.innerText = percentage + '%';

            // Частицы при лечении
            createExplosion(e.clientX, e.clientY, 'heal', 6);

            if (clicks >= maxClicks) {
                winGame();
            }
        });

        document.addEventListener('touchstart', (e) => {}, {passive: false});

        function createExplosion(x, y, type, count) {
            for (let i = 0; i < count; i++) {
                particles.push(new EmojiParticle(x, y, type));
            }
        }

        function winGame() {
            isWon = true;
            
            // 1. Белый пушистый котенок
            catContainer.innerHTML = '<img src="https://images.unsplash.com/photo-1517423724114-6eb986d013b4?w=400&q=80" class="happy-cat-img" alt="White Kitten">';
            catContainer.classList.remove('shake');
            catContainer.style.border = '3px solid #fff'; // Рамка становится белой
            catContainer.style.boxShadow = '0 0 30px #ff0099';

            // 2. Текст
            mainTitle.innerHTML = "Выздоравливай,<br>Кицюня 🤍";
            mainTitle.classList.add('winner-text');
            
            // 3. Убираем лишнее
            subTitle.style.opacity = '0';
            progressWrapper.style.opacity = '0';

            // 4. Салют (аккуратный, не перегруженный)
            let loopCount = 0;
            const interval = setInterval(() => {
                // Вылетает по чуть-чуть в разных местах
                createExplosion(width/2, height/2, 'win', 8); 
                createExplosion(Math.random()*width, Math.random()*height, 'win', 5);
                loopCount++;
                if (loopCount > 8) clearInterval(interval); // Меньше повторов
            }, 400); // Медленнее интервал
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].life <= 0) {
                    particles.splice(i, 1);
                    i--;
                }
            }
            requestAnimationFrame(animate);
        }

        catContainer.classList.add('shake');
        animate();

    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Альбина</title>
    <!-- Подключаем красивые шрифты -->
    <link href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Montserrat:wght@300;700&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden; /* Убираем прокрутку */
            font-family: 'Montserrat', sans-serif;
        }

        /* Контейнер для текста поверх анимации */
        .container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
            pointer-events: none; /* Чтобы клики проходили сквозь текст */
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            color: #fff;
            font-size: 4rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 4px;
            /* Неоновое свечение */
            animation: neon 1.5s ease-in-out infinite alternate;
        }

        p {
            font-family: 'Marck Script', cursive;
            color: #ff69b4; /* Розовый */
            font-size: 2.5rem;
            margin-top: 10px;
            opacity: 0;
            animation: fadeIn 2s ease-out forwards 1s; /* Появляется через 1 секунду */
        }

        canvas {
            display: block;
        }

        /* Анимация неона */
        @keyframes neon {
            from {
                text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px #ff00de, 0 0 40px #ff00de;
            }
            to {
                text-shadow: 0 0 20px #fff, 0 0 30px #ff4da6, 0 0 40px #ff4da6, 0 0 50px #ff4da6, 0 0 60px #ff4da6;
            }
        }

        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
            from { opacity: 0; transform: translateY(20px); }
        }

        /* Адаптив для телефонов */
        @media (max-width: 600px) {
            h1 { font-size: 3rem; }
            p { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Альбина</h1>
        <p>у тебя красивые глаза</p>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let particles = [];
        
        // Настройка размера на весь экран
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Класс частицы (звездочки/искры)
        class Particle {
            constructor(x, y, type = 'bg') {
                this.x = x || Math.random() * width;
                this.y = y || Math.random() * height;
                this.type = type; // 'bg' - фон, 'firework' - взрыв
                
                const angle = Math.random() * Math.PI * 2;
                const speed = type === 'firework' ? Math.random() * 5 + 2 : Math.random() * 0.5;
                
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                
                this.size = Math.random() * 3;
                this.life = 100; // Жизнь частицы
                this.color = `hsl(${Math.random() * 60 + 300}, 100%, 70%)`; // Розово-фиолетовые тона
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                
                if (this.type === 'firework') {
                    this.life -= 2;
                    this.vy += 0.05; // Гравитация для салюта
                } else {
                    // Если частица улетела за экран, возвращаем её
                    if (this.x < 0) this.x = width;
                    if (this.x > width) this.x = 0;
                    if (this.y < 0) this.y = height;
                    if (this.y > height) this.y = 0;
                }
            }

            draw() {
                ctx.globalAlpha = this.life / 100;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }

        // Создаем фон
        function initBackground() {
            for(let i=0; i<80; i++) {
                particles.push(new Particle(null, null, 'bg'));
            }
        }

        // Эффект при движении мыши
        window.addEventListener('mousemove', e => {
            for(let i=0; i<2; i++) {
                particles.push(new Particle(e.clientX, e.clientY, 'firework'));
            }
        });

        // Эффект при касании (для телефона)
        window.addEventListener('touchmove', e => {
            const touch = e.touches[0];
            for(let i=0; i<2; i++) {
                particles.push(new Particle(touch.clientX, touch.clientY, 'firework'));
            }
        });

        // Взрыв при клике
        window.addEventListener('click', e => {
            for(let i=0; i<30; i++) {
                particles.push(new Particle(e.clientX, e.clientY, 'firework'));
            }
        });

        function animate() {
            // Рисуем полупрозрачный фон для эффекта шлейфа
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, width, height);

            particles.forEach((p, index) => {
                p.update();
                p.draw();
                // Удаляем умершие частицы
                if (p.life <= 0) particles.splice(index, 1);
            });

            requestAnimationFrame(animate);
        }

        initBackground();
        animate();
        
        // Автоматический взрыв при старте
        setTimeout(() => {
            for(let i=0; i<50; i++) {
                particles.push(new Particle(width/2, height/2, 'firework'));
            }
        }, 500);

    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Для Альбины ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%);
            touch-action: manipulation; /* Защита от двойного тапа для зума */
            user-select: none;
            -webkit-user-select: none;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .ui-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
            width: 90%;
            pointer-events: none; /* Чтобы клики проходили сквозь текст на канвас */
        }

        h1 {
            color: #fff;
            font-size: 2.5rem;
            line-height: 1.2;
            font-weight: 900;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
            margin-bottom: 20px;
            transition: all 0.5s ease;
        }

        p.instruction {
            font-family: 'Pacifico', cursive;
            color: #fff;
            font-size: 1.8rem;
            text-shadow: 0 2px 5px rgba(0,0,0,0.2);
            margin-bottom: 40px;
            transition: opacity 0.5s;
        }

        /* Прогресс бар */
        .progress-wrapper {
            width: 100%;
            max-width: 300px;
            height: 30px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
            border: 2px solid #fff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: opacity 1s;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ff9a9e 0%, #ff6a88 100%);
            border-radius: 50px;
            transition: width 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .progress-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-weight: bold;
            font-size: 0.9rem;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
            z-index: 2;
        }

        .signature {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            color: #fff;
            font-family: 'Pacifico', cursive;
            opacity: 0.8;
            z-index: 5;
            font-size: 1.2rem;
        }

        /* Анимация победы */
        .winner-text {
            color: #ff0055 !important;
            transform: scale(1.1);
            text-shadow: 0 0 20px rgba(255, 0, 85, 0.5);
        }
        
        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            p.instruction { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="gameCanvas"></canvas>
    </div>

    <div class="ui-container">
        <h1 id="mainTitle">Альбина, Солнышко,<br>выздоравливай!</h1>
        <p class="instruction" id="subTitle">Тапай, чтобы уничтожить ангину!</p>
        
        <div class="progress-wrapper" id="progressWrapper">
            <div class="progress-bar" id="progressBar"></div>
            <div class="progress-text" id="progressText">0%</div>
        </div>
    </div>

    <div class="signature">С любовью, Саша ❤️</div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Элементы интерфейса
        const mainTitle = document.getElementById('mainTitle');
        const subTitle = document.getElementById('subTitle');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const progressWrapper = document.getElementById('progressWrapper');

        let width, height;
        let particles = [];
        let clicks = 0;
        const maxClicks = 5;
        let isWon = false;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Функция рисования сердца
        function drawHeart(x, y, size, color) {
            ctx.beginPath();
            ctx.fillStyle = color;
            ctx.moveTo(x, y);
            ctx.bezierCurveTo(x - size / 2, y - size / 2, x - size, y + size / 3, x, y + size);
            ctx.bezierCurveTo(x + size, y + size / 3, x + size / 2, y - size / 2, x, y);
            ctx.fill();
        }

        class Particle {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type; // 'virus' (серый дым) или 'heart' (любовь)
                this.size = Math.random() * 10 + 5;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 5 + 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.life = 100;
                this.gravity = 0.1;
                
                if (type === 'virus') {
                    this.color = `rgba(100, 100, 100, ${Math.random()})`;
                } else {
                    this.color = `hsl(${Math.random() * 50 + 330}, 100%, 60%)`; // Розовые/Красные
                }
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += this.gravity;
                this.life -= 1.5;
                this.size -= 0.1;
            }

            draw() {
                if (this.life <= 0) return;
                
                if (this.type === 'heart') {
                    drawHeart(this.x, this.y, this.size, this.color);
                } else {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                }
            }
        }

        // Обработка клика
        document.addEventListener('click', (e) => {
            if (isWon) {
                // Если уже выиграла, просто пускаем салют
                createExplosion(e.clientX, e.clientY, 'heart', 10);
                return;
            }

            clicks++;
            
            // Обновляем прогресс
            const percentage = Math.min((clicks / maxClicks) * 100, 100);
            progressBar.style.width = percentage + '%';
            progressText.innerText = percentage + '%';

            // Эффекты "удара" по болезни
            createExplosion(e.clientX, e.clientY, 'heart', 15);

            // Проверка победы
            if (clicks >= maxClicks) {
                winGame();
            }
        });

        // Также обрабатываем тач для мобильных (чтобы быстрее реагировало)
        document.addEventListener('touchstart', (e) => {
            // Предотвращаем стандартный зум и скролл
            // Логика дублируется в click, браузеры сами разберутся, но click надежнее для счетчика
        }, {passive: false});

        function createExplosion(x, y, type, count) {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, type));
            }
        }

        function winGame() {
            isWon = true;
            
            // Меняем интерфейс
            progressBar.style.background = 'linear-gradient(90deg, #00b09b, #96c93d)'; // Зеленый цвет победы
            mainTitle.innerHTML = "Выздоравливай,<br>кицюня ❤️";
            mainTitle.classList.add('winner-text');
            subTitle.style.opacity = '0'; // Скрываем инструкцию
            
            // Скрываем бар через секунду
            setTimeout(() => {
                progressWrapper.style.opacity = '0';
            }, 1500);

            // Запускаем большой салют
            let loopCount = 0;
            const interval = setInterval(() => {
                createExplosion(width/2, height/2, 'heart', 20);
                createExplosion(width/4, height/3, 'heart', 10);
                createExplosion(width*0.75, height/3, 'heart', 10);
                loopCount++;
                if (loopCount > 10) clearInterval(interval);
            }, 300);
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].life <= 0) {
                    particles.splice(i, 1);
                    i--;
                }
            }
            
            // Если выиграли, добавляем медленно падающие сердца на фон
            if (isWon && Math.random() < 0.1) {
                const p = new Particle(Math.random() * width, -20, 'heart');
                p.vy = Math.random() * 2 + 1;
                p.vx = Math.random() * 2 - 1;
                p.gravity = 0;
                p.life = 300;
                particles.push(p);
            }

            requestAnimationFrame(animate);
        }

        animate();

    </script>
</body>
</html>

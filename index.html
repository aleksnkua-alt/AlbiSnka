<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Выздоравливай, Альбина!</title>
    
    <!-- Подключаем Tailwind CSS для красоты -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Шрифты: Pacifico (рукописный) и Varela Round (круглый) -->
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Varela+Round&display=swap" rel="stylesheet">

    <!-- Настройка цветов Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'barbie-pink': '#FF69B4', // Hot Pink
                        'soft-pink': '#FFC0CB',
                        'love-red': '#E11D48',
                    },
                    fontFamily: {
                        'hand': ['"Pacifico"', 'cursive'],
                        'round': ['"Varela Round"', 'sans-serif'],
                    },
                    animation: {
                        'shake': 'shake 0.5s cubic-bezier(.36,.07,.19,.97) infinite',
                        'pop': 'pop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
                        'float': 'float 3s ease-in-out infinite',
                    },
                    keyframes: {
                        shake: {
                            '10%, 90%': { transform: 'translate3d(-1px, 0, 0)' },
                            '20%, 80%': { transform: 'translate3d(2px, 0, 0)' },
                            '30%, 50%, 70%': { transform: 'translate3d(-4px, 0, 0)' },
                            '40%, 60%': { transform: 'translate3d(4px, 0, 0)' }
                        },
                        pop: {
                            '0%': { transform: 'scale(0.5)', opacity: '0' },
                            '100%': { transform: 'scale(1)', opacity: '1' }
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' }
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Varela Round', sans-serif;
            background: linear-gradient(135deg, #FFF0F5 0%, #FF69B4 100%);
            overflow: hidden; /* Чтобы не скроллилось при кликах */
            touch-action: manipulation; /* Улучшает реакцию на тапы */
            user-select: none; /* Запрет выделения текста */
            -webkit-tap-highlight-color: transparent;
        }

        /* Паттерн с сердечками на фоне */
        .bg-pattern {
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 45 C15 45 5 25 15 15 C20 10 30 15 30 25 C30 15 40 10 45 15 C55 25 45 45 30 45 Z' fill='%23ffffff' fill-opacity='0.2'/%3E%3C/svg%3E");
            background-size: 60px 60px;
        }

        /* Анимация вылетающих эмодзи */
        @keyframes flyUp {
            0% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-150px) scale(1.5) rotate(45deg); opacity: 0; }
        }
        .particle {
            position: absolute;
            pointer-events: none;
            animation: flyUp 1s ease-out forwards;
            font-size: 2rem;
            z-index: 50;
        }

        /* Конфетти */
        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }
        .confetti {
            position: absolute;
            top: -50px;
            animation: fall linear forwards;
            z-index: 40;
        }
    </style>
</head>
<body class="h-screen w-full flex items-center justify-center relative">

    <!-- Фоновый паттерн -->
    <div class="absolute inset-0 bg-pattern pointer-events-none"></div>

    <!-- Основной контейнер (Карточка) -->
    <div id="game-container" class="relative z-10 w-full max-w-md px-6 flex flex-col items-center gap-6 text-center cursor-pointer">
        
        <!-- Заголовок -->
        <h1 class="text-4xl md:text-5xl text-white drop-shadow-md font-hand animate-float">
            Альбина <br> Солнышко ☀️
        </h1>

        <!-- Рамка с персонажем -->
        <div id="character-frame" class="relative w-64 h-64 md:w-80 md:h-80 rounded-full border-8 bg-white shadow-2xl transition-all duration-500 overflow-hidden border-rose-300 animate-shake">
            
            <!-- Векторный грустный котик (SVG) -->
            <div id="sick-cat" class="w-full h-full p-4 flex items-center justify-center">
                <svg viewBox="0 0 200 200" class="w-full h-full">
                    <!-- Голова -->
                    <circle cx="100" cy="100" r="85" fill="#FFE4E6" stroke="#FB7185" stroke-width="4" />
                    <!-- Уши -->
                    <path d="M35 50 L35 15 L75 45 Z" fill="#FB7185" />
                    <path d="M165 50 L165 15 L125 45 Z" fill="#FB7185" />
                    <!-- Глаза (Грустные) -->
                    <path d="M60 95 Q75 85 90 95" stroke="#BE123C" stroke-width="5" fill="none" />
                    <path d="M110 95 Q125 85 140 95" stroke="#BE123C" stroke-width="5" fill="none" />
                    <!-- Слезы -->
                    <path d="M70 105 Q70 125 65 120" stroke="#3B82F6" stroke-width="3" fill="#60A5FA" class="animate-pulse" />
                    <path d="M130 105 Q130 125 135 120" stroke="#3B82F6" stroke-width="3" fill="#60A5FA" style="animation-delay: 0.5s;" class="animate-pulse" />
                    <!-- Рот -->
                    <path d="M90 125 Q100 115 110 125" stroke="#BE123C" stroke-width="3" fill="none" />
                    <!-- Пластырь на лбу -->
                    <rect x="90" y="35" width="40" height="15" transform="rotate(15 110 42)" fill="#FCD34D" rx="4" border="1" stroke="#F59E0B" />
                    <!-- Лапки держат градусник -->
                     <circle cx="60" cy="140" r="15" fill="#FB7185" />
                     <circle cx="140" cy="140" r="15" fill="#FB7185" />
                     <rect x="50" y="130" width="100" height="10" fill="#E2E8F0" rx="5" transform="rotate(10 100 135)" />
                     <rect x="50" y="130" width="30" height="10" fill="#EF4444" rx="5" transform="rotate(10 100 135)" />
                </svg>
            </div>

            <!-- Фото здорового котенка (Скрыто сначала) -->
            <img id="healthy-cat" 
                 src="image_0.png" 
                 alt="Cute White Kitten" 
                 class="hidden w-full h-full object-cover animate-pop"
            >
        </div>

        <!-- Блок текста и прогресса -->
        <div id="status-area" class="w-full space-y-4">
            <p id="instruction" class="text-xl text-white font-bold drop-shadow-md animate-pulse">
                Тапай 12 раз, чтобы прогнать ангину!
            </p>

            <!-- Прогресс бар -->
            <div id="progress-container" class="w-full h-8 bg-white/50 rounded-full border-4 border-white overflow-hidden shadow-inner relative">
                <div id="progress-bar" class="h-full bg-gradient-to-r from-yellow-400 to-red-400 w-0 transition-all duration-300 ease-out flex items-center justify-center">
                </div>
            </div>
            
            <p id="counter-text" class="text-white font-medium opacity-90">0 / 12</p>
        </div>

        <!-- Финальное сообщение (Скрыто) -->
        <div id="win-message" class="hidden flex-col items-center gap-4 animate-pop">
            <h2 class="text-3xl font-bold text-white drop-shadow-lg leading-tight">
                Выздоравливай, <br> Кицюня 💖
            </h2>
            <div class="bg-white/80 backdrop-blur px-6 py-3 rounded-2xl shadow-lg transform rotate-2">
                <p class="text-2xl text-rose-600 font-hand">С любовью, Саша ❤️</p>
            </div>
        </div>

    </div>

    <script>
        // --- Логика игры ---
        let taps = 0;
        const maxTaps = 12;
        let isWon = false;
        
        // Элементы
        const container = document.body; // Кликаем по всему боди для удобства
        const progressBar = document.getElementById('progress-bar');
        const counterText = document.getElementById('counter-text');
        const frame = document.getElementById('character-frame');
        const sickCat = document.getElementById('sick-cat');
        const healthyCat = document.getElementById('healthy-cat');
        const statusArea = document.getElementById('status-area');
        const winMessage = document.getElementById('win-message');

        // Лечебные эмодзи
        const emojis = ['💊', '🍓', '🌸', '🩹', '✨', '💖', '🍯'];

        // Звуки (опционально, браузеры блокируют автоплей, но попробуем без звука, только визуал)

        // Обработчик клика
        document.addEventListener('click', (e) => {
            if (isWon) {
                createConfettiBurst(e.clientX, e.clientY);
                return;
            }

            taps++;
            updateProgress();
            spawnParticles(e.clientX, e.clientY);

            if (taps >= maxTaps) {
                winGame();
            }
        });

        // Функция обновления прогресса
        function updateProgress() {
            const percent = (taps / maxTaps) * 100;
            progressBar.style.width = `${percent}%`;
            counterText.innerText = `${taps} / ${maxTaps}`;
            
            // Легкая вибрация телефона при тапе
            if (navigator.vibrate) navigator.vibrate(50);
        }

        // Функция создания частиц (эмодзи)
        function spawnParticles(x, y) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            particle.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            
            // Небольшой разброс координат
            const randomX = (Math.random() - 0.5) * 50;
            
            particle.style.left = `${x + randomX}px`;
            particle.style.top = `${y}px`;
            
            document.body.appendChild(particle);

            // Удаляем элемент после анимации
            setTimeout(() => {
                particle.remove();
            }, 1000);
        }

        // Функция Победы
        function winGame() {
            isWon = true;

            // 1. Останавливаем тряску и добавляем свечение
            frame.classList.remove('animate-shake', 'border-rose-300');
            frame.classList.add('border-yellow-300', 'shadow-[0_0_50px_rgba(255,255,255,0.8)]', 'scale-110');
            
            // 2. Меняем картинку
            sickCat.classList.add('hidden');
            healthyCat.classList.remove('hidden');

            // 3. Скрываем прогресс, показываем финал
            statusArea.classList.add('hidden');
            winMessage.classList.remove('hidden');
            winMessage.style.display = 'flex';

            // 4. Запускаем салют
            startConfettiLoop();
            
            // Вибрация победы
            if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
        }

        // --- Конфетти система ---
        function createConfettiBurst(x, y) {
            // Если координаты не переданы (автоматический запуск), берем центр
            x = x || window.innerWidth / 2;
            y = y || window.innerHeight / 2;
            
            for(let i=0; i<10; i++) {
                const conf = document.createElement('div');
                conf.classList.add('confetti');
                conf.innerText = Math.random() > 0.5 ? '💖' : '🐾';
                conf.style.left = Math.random() * 100 + 'vw';
                conf.style.fontSize = (Math.random() * 20 + 10) + 'px';
                conf.style.animationDuration = (Math.random() * 2 + 2) + 's';
                document.body.appendChild(conf);
                
                setTimeout(() => conf.remove(), 4000);
            }
        }

        function startConfettiLoop() {
            setInterval(() => {
                createConfettiBurst();
            }, 300);
            // Сразу один залп
            for(let i=0; i<5; i++) createConfettiBurst();
        }

    </script>
</body>
</html>

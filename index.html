<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для Альбины ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Montserrat:wght@300;600&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        /* Анимация переливающегося фона */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
            width: 90%;
            pointer-events: none; /* Клики проходят сквозь текст */
            text-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        h1 {
            color: #fff;
            font-size: 3.5rem;
            margin: 0;
            font-weight: 700;
            line-height: 1.2;
            animation: slideDown 1.5s ease-out;
        }

        .message {
            font-family: 'Caveat', cursive;
            color: #fff;
            font-size: 2.2rem;
            margin-top: 20px;
            font-weight: 700;
            opacity: 0;
            animation: fadeIn 2s ease-out forwards 1s;
        }

        .signature {
            margin-top: 40px;
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.9);
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeIn 2s ease-out forwards 2s;
        }

        @keyframes slideDown {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        @media (max-width: 600px) {
            h1 { font-size: 2.2rem; }
            .message { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="magicCanvas"></canvas>
    </div>

    <div class="content">
        <h1>Альбина,<br>выздоравливай!</h1>
        <div class="message">Пусть болезнь уйдет, как этот дым...</div>
        <div class="signature">С любовью, Саша ❤️</div>
    </div>

    <script>
        const canvas = document.getElementById('magicCanvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let particles = [];
        
        // Настройка размера
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Класс для частиц (Светлячки и пыльца)
        class Particle {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type; // 'firefly' (светлячок) или 'spark' (искра от мыши)
                
                if (type === 'firefly') {
                    this.size = Math.random() * 4 + 1;
                    this.vx = (Math.random() - 0.5) * 1;
                    this.vy = (Math.random() - 0.5) * 1;
                    this.life = 1000; // Живут долго
                    this.alpha = Math.random() * 0.5 + 0.1;
                } else {
                    this.size = Math.random() * 3;
                    this.vx = (Math.random() - 0.5) * 4;
                    this.vy = (Math.random() - 0.5) * 4;
                    this.life = 100; // Живут мало
                    this.alpha = 1;
                }
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.type === 'firefly') {
                    // Светлячки плавно меняют направление и мерцают
                    if (this.x < 0 || this.x > width) this.vx *= -1;
                    if (this.y < 0 || this.y > height) this.vy *= -1;
                    this.alpha += (Math.random() - 0.5) * 0.05;
                    if (this.alpha < 0.1) this.alpha = 0.1;
                    if (this.alpha > 0.6) this.alpha = 0.6;
                } else {
                    // Искры исчезают
                    this.life -= 2;
                    this.size -= 0.05;
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, Math.max(0, this.size), 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.type === 'spark' ? this.life/100 : this.alpha})`;
                ctx.shadowBlur = this.type === 'firefly' ? 10 : 0;
                ctx.shadowColor = "white";
                ctx.fill();
            }
        }

        // Создаем светлячков
        function initFireflies() {
            for(let i=0; i<50; i++) {
                particles.push(new Particle(Math.random()*width, Math.random()*height, 'firefly'));
            }
        }

        // Обработка движения мыши/пальца
        function addSparks(x, y) {
            for(let i=0; i<3; i++) {
                particles.push(new Particle(x, y, 'spark'));
            }
        }

        window.addEventListener('mousemove', e => addSparks(e.clientX, e.clientY));
        window.addEventListener('touchmove', e => {
            const t = e.touches[0];
            addSparks(t.clientX, t.clientY);
        });
        window.addEventListener('click', e => {
            for(let i=0; i<15; i++) addSparks(e.clientX, e.clientY);
        });

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();

                if (particles[i].life <= 0 || particles[i].size <= 0) {
                    particles.splice(i, 1);
                    i--;
                }
            }
            requestAnimationFrame(animate);
        }

        initFireflies();
        animate();
    </script>
</body>
</html>
